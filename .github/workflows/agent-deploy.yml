name: Deploy agent operations
on:
  push:
    branches: [agent-operations-v1]
    paths:
      - 'services/agents/**'
      - '.github/workflows/agent-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sds-agent-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/agents/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Provision, deploy and verify
        run: node scripts/deploy-ci.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SDS_ADMIN_TOKEN: ${{ secrets.SDS_ADMIN_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
